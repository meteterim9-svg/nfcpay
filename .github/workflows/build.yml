name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: flutter create . --platforms=android --org com.example
      - name: Install dependencies
        run: flutter pub get
      - name: Force plugin subprojects to compileSdk 36
        run: |
          if [ ! -f android/build.gradle.kts ]; then
            echo "root build.gradle.kts missing"; exit 1
          fi
          cat android/build.gradle.kts
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfcpay-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
