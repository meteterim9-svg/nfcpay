name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android klasorunu repoda tutmuyoruz; her derlemede olusturuyoruz.
      - name: Android iskeletini olustur
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          cp -r test /tmp/test_bak
          flutter create --platforms=android --project-name orvexa --org com.orvexa .
          rm -rf lib
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml
          rm -rf test
          cp -r /tmp/test_bak test

      # Internet izni ve uygulama adi.
      - name: Manifest ayarlari
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Orvexa"#' $M
          grep -n "INTERNET\|BIOMETRIC\|label" $M

      # Ekran koruma kanali (FLAG_SECURE) + biyometrik icin FragmentActivity.
      - name: Android yerel kod
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -1)
          printf '%s\n' "$(grep -m1 '^package' "$F")" > "$F"
          cat >> "$F" <<'KT'

          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "orvexa/secure")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "setSecure") {
                              val on = call.argument<Boolean>("on") ?: true
                              runOnUiThread {
                                  if (on) window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                                  else window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                              }
                              result.success(null)
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          KT
          for f in android/app/src/main/res/values*/styles.xml; do
            sed -i 's#parent="@android:style/Theme.Light.NoTitleBar"#parent="Theme.AppCompat.Light.NoActionBar"#; s#parent="@android:style/Theme.Black.NoTitleBar"#parent="Theme.AppCompat.NoActionBar"#' "$f"
          done
          cat "$F" | head -8

      # flutter_secure_storage en az Android 6 (API 23) ister.
      - name: minSdk 23 yap
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          done

      - name: Paketleri al
        shell: bash
        run: |
          mkdir -p /tmp/logs
          flutter pub get 2>&1 | tee /tmp/logs/1-pub.log

      - name: Analiz (sadece hatalar)
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/logs/2-analyze.log

      # Imza/adres testleri: bir tanesi bile tutmazsa APK uretilmez.
      - name: Testler
        shell: bash
        run: flutter test 2>&1 | tee /tmp/logs/3-test.log

      - name: APK derle
        shell: bash
        run: flutter build apk --release 2>&1 | tee /tmp/logs/4-build.log

      - uses: actions/upload-artifact@v4
        with:
          name: kripto-cuzdan-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Telefondan kolay indirmek icin APK'yi Releases sayfasina da koy.
      - name: Release olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk orvexa.apk
          gh release create "build-${{ github.run_number }}" orvexa.apk \
            --title "Derleme ${{ github.run_number }}" \
            --notes "Telefonda kurmak icin orvexa.apk dosyasina dokun."

      # Basarisiz olursa hata kaydini Releases'a (on surum) yaz, boylece okunabilir.
      - name: Hata kaydi
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Calisma ${{ github.run_number }} basarisiz."
            echo
            for f in /tmp/logs/*.log; do
              [ -f "$f" ] || continue
              echo "=== $(basename $f) ==="
              tail -c 20000 "$f" | sed 's/\x1b\[[0-9;]*m//g'
              echo
            done
          } > /tmp/fail.md
          gh release create "fail-${{ github.run_number }}" --prerelease \
            --title "HATA ${{ github.run_number }}" --notes-file /tmp/fail.md
