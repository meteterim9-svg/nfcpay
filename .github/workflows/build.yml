name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: flutter create . --platforms=android --org com.example
      - name: Install dependencies
        run: flutter pub get
      - name: Verify Android Gradle configuration
        run: |
          test -f android/build.gradle.kts
          cat android/build.gradle.kts
      - name: Build one universal release APK
        run: flutter build apk --release
      - name: Verify APK archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          unzip -t "$apk"
          sha256sum "$apk"
          ls -lh "$apk"
      - name: Upload one APK
        uses: actions/upload-artifact@v4
        with:
          name: nfcpay-single-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
