name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android iskeletini olustur
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --platforms=android --project-name nfcpay --org com.nfcpay .
          rm -rf lib
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml

      - name: Manifest ayarlari
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.NFC"/>\n    <uses-feature android:name="android.hardware.nfc" android:required="false"/>\n    <application#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="NFC Pay"#' $M
          grep -n "NFC\|BIOMETRIC\|label" $M

      - name: Android yerel kod
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -1)
          printf '%s\n' "$(grep -m1 '^package' "$F")" > "$F"
          cat >> "$F" <<'KT'

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          KT
          cat "$F" | head -8

      - name: minSdk 23 yap
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          done

      - name: Paketleri al
        shell: bash
        run: |
          mkdir -p /tmp/logs
          flutter pub get 2>&1 | tee /tmp/logs/1-pub.log

      - name: Analiz (sadece hatalar)
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/logs/2-analyze.log

      - name: APK derle
        shell: bash
        run: flutter build apk --release 2>&1 | tee /tmp/logs/4-build.log

      - uses: actions/upload-artifact@v4
        with:
          name: nfcpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk nfcpay.apk
          gh release create "build-${{ github.run_number }}" nfcpay.apk \
            --title "Derleme ${{ github.run_number }}" \
            --notes "Telefonda kurmak icin nfcpay.apk dosyasina dokun."

      - name: Hata kaydi
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Calisma ${{ github.run_number }} basarisiz."
            echo
            for f in /tmp/logs/*.log; do
              [ -f "$f" ] || continue
              echo "=== $(basename $f) ==="
              tail -c 20000 "$f" | sed 's/\x1b\[[0-9;]*m//g'
              echo
            done
          } > /tmp/fail.md
          gh release create "fail-${{ github.run_number }}" --prerelease \
            --title "HATA ${{ github.run_number }}" --notes-file /tmp/fail.md
