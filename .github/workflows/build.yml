name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: flutter create . --platforms=android --org com.example
      - name: Install dependencies
        run: flutter pub get
      - name: Verify Android Gradle configuration
        run: |
          test -f android/build.gradle.kts
          cat android/build.gradle.kts
      - name: Build release APKs per ABI
        run: flutter build apk --release --split-per-abi
      - name: Verify APK archives and signatures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          test ${#apks[@]} -gt 0
          for apk in "${apks[@]}"; do
            echo "Checking $apk"
            unzip -t "$apk"
            echo "SHA256:"
            sha256sum "$apk"
            ls -lh "$apk"
          done
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: nfcpay-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
